{% load main_extras %}

{% for category, category_dict in all_dict.items %}
    <div class="nav-menu-text category list-group-item list-group-item-action" id="category_{{category|get_id}}_head" onclick="menu_click(event)">
        <i class="category-icon fas fa-{{icon}}"></i>
        <span class="sidebar-span">{{category|get_name}}</span>
        <span class="submenu-icon ml-auto"> <i class="fas"></i> </span>
    </div>
    <div id="category_{{category|get_id}}" class="category-submenu collapse submenu-collapse">
        {% for database, column_list in category_dict.items %}
            {% include 'databaseMenu.html' %}
        {% endfor %}
    </div>
{% endfor %}
